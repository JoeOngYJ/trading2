server_name: signal-broker
port: 4222
http_port: 8222

jetstream {
  store_dir: /data/jetstream
  max_file_store: 10GB
}

authorization {
  users: [
    { user: signal_publisher, password: $NATS_SIGNAL_PUBLISHER_PASSWORD,
      permissions: {
        publish: ["signals.v2.>", "$JS.API.>"],
        subscribe: ["_INBOX.>"]
      }
    },
    { user: freqtrade_bridge, password: $NATS_FREQTRADE_BRIDGE_PASSWORD,
      permissions: {
        publish: ["signals.dlq.>", "$JS.API.>", "$JS.ACK.>"],
        subscribe: ["_INBOX.>", "signals.v2.>"]
      }
    }
  ]
}
